[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "tipo_de_cambio"
version = "0.0.1"
description = "Este proyecto busca calcular el tipo de cambio de acuerdo a la cantidad de pr\u00e9stamos hipotecarios y/o prendarios, o predecir la cantidad de pr\u00e9stamos hipotecarios de acuerdo al tipo de cambio."
authors = [
  { name = "Fabian Quispe" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["tipo_de_cambio"]
include = ["pyproject.toml", "tipo_de_cambio/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["tipo_de_cambio"]
force-sort-within-sections = true

